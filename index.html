<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>會議紀錄總入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Manrope:wght@600;800&display=swap">
<style>
:root{--bg:#eef2f7;--ink:#14213a;--muted:#5d6b82;--panel:#fff;--line:#dbe2ec;--side:#13284b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#8a5cd6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
header{background:var(--side);color:#fff;padding:28px 16px 30px;text-align:center}
header .t{font-size:14px;color:#a9bcdc;letter-spacing:.08em}
header h1{margin:6px 0 0;font-size:26px;font-weight:700}
main{max-width:960px;margin:0 auto;padding:28px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:200px;padding:24px 26px;
  background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;
  color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(20,33,58,.06);transition:transform .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,33,58,.12);outline:none}
.tile .no{font-family:Manrope,sans-serif;font-weight:800;font-size:15px;color:var(--c)}
.tile h2{margin:6px 0 0;font-size:30px;font-weight:700}
.tile .meta{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px;color:var(--muted);font-size:14px}
.tile .n{font-family:Manrope,sans-serif;font-weight:800;font-size:40px;line-height:1;color:var(--ink)}
.tile .n small{font-family:"Noto Sans TC",sans-serif;font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.tile .go{font-weight:700;color:var(--c);white-space:nowrap}
.all{display:block;margin:24px auto 0;width:max-content;max-width:100%;color:var(--muted);font-size:14px}
@media (max-width:640px){.grid{grid-template-columns:1fr;gap:14px}.tile{min-height:150px;padding:20px}.tile h2{font-size:26px}.tile .n{font-size:32px}}
</style>
</head>
<body>
<header>
  <div class="t">裕信汽車 服務部</div>
  <h1>會議紀錄總入口</h1>
</header>
<main>
  <div class="grid" id="grid"></div>
  <a class="all" href="app/index.html#/board?tp=">查看全部會議 →</a>
</main>
<script src="app/data/meetings.js"></script>
<script>
// 四個類別名稱需與 app/js/app.js 的 BASE_TYPES 相同
var T=[['廠長會議','var(--s1)'],['服務部會議','var(--s2)'],['改善會議','var(--s3)'],['課程會議','var(--s4)']];
var D=window.MEETING_DATA||[];
document.getElementById('grid').innerHTML=T.map(function(t,i){
  var ms=D.filter(function(m){return m.type===t[0]}).sort(function(a,b){return b.date<a.date?-1:1});
  var last=ms.length?'最近一場 '+ms[0].date.replace(/-/g,'/'):'尚無會議紀錄';
  return '<a class="tile" style="--c:'+t[1]+'" href="app/index.html#/board?tp='+encodeURIComponent(t[0])+'">'+
    '<div><div class="no">0'+(i+1)+'</div><h2>'+t[0]+'</h2></div>'+
    '<div class="meta"><div><div class="n">'+ms.length+'<small>場</small></div><div>'+last+'</div></div><span class="go">進入 →</span></div></a>';
}).join('');
</script>
</body>
</html>
